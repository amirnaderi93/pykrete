# GitLab CI/CD pipeline for pykrete.
#
# Runs on every push and merge request. Three jobs:
#   - build_and_test : cargo build + cargo test
#   - fmt            : cargo fmt --check (enforces consistent formatting)
#   - clippy         : cargo clippy (allowed to fail for now; tightens later)
#
# The cache reuses target/ + .cargo/ across runs so the slow first build
# (which clones ruff from git) doesn't repeat on every push.

default:
  image: rust:1
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_INCREMENTAL: "0"

stages:
  - check

build_and_test:
  stage: check
  script:
    - rustc --version
    - cargo --version
    - cargo build --verbose
    - cargo test --verbose

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  allow_failure: true
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -W clippy::all
