name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: build · test · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        # Pinned so `cargo fmt --check` and `clippy -D warnings` stay
        # reproducible — both drift across toolchain releases.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      # Caches the cargo registry, the git-cloned ruff crates, and
      # target/ — so the slow first build doesn't repeat every run.
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Closes v1.7 retro rule 6 + v1.8 retro rule 7: any binary-output
      # string quoted in a CHANGELOG.md fenced stderr/stdout/text block
      # must grep-anchor to crates/pykrete/src/, and any number in a
      # text-numeric block must match the live-extract command for its
      # key. See scripts/changelog-grep.sh + v1.8-spec §2.2 + v1.9-spec
      # §2.2. --skip-live-extract because pykrete-tests isn't checked
      # out beside pykrete on the runner; release-time runs (PR-F +
      # local verification) run without the flag.
      - name: CHANGELOG-binary string drift gate
        run: bash scripts/changelog-grep.sh --skip-live-extract
      - name: CHANGELOG-binary string drift gate — self-tests
        run: bash scripts/changelog-grep.test.sh
