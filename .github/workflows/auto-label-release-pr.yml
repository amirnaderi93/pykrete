# Auto-apply `release-ready` label
#
# v1.11 PR-A2 — closes v1.10 retro rule 8 (release-gate trigger boundary).
# v1.12 PR-A1 — closes v1.11.0 GITHUB_TOKEN cross-workflow trigger gap by
# dispatching release-gate.yml explicitly via the actions API (option (c)
# per v1.12 spec §2.1.1; pull_request_target was hard-rejected as a
# supply-chain crack).
# v1.14 PR-A2 — adds `labeled` to trigger types so manually re-applying
# `release-ready` (post-rebase operator reflex per v1.13 retro rule 11)
# also re-dispatches release-gate. Investigation of v1.13 PR-G #192
# confirmed the existing `synchronize` path already re-dispatches on
# force-push (run 27938828360 fired automatically), so the manual
# remove+re-add toggle was redundant — but adding `labeled` makes the
# operator reflex genuinely effective and surfaces the redundancy via
# a distinct log line.
#
# WHY THIS EXISTS
# ---------------
# The release-gate workflow (`.github/workflows/release-gate.yml`) gates
# its full live-extract trust-claim sweep on the `release-ready` label.
# In v1.10 PR-F (#164), the dev didn't apply the label and the gate
# never ran on the cycle-close PR; TM had to apply the label manually
# post-audit. This workflow closes the human-gate structural gap: any
# PR whose title or source branch identifies it as a release-cycle PR
# gets the label auto-applied on open / edit / sync / label.
#
# DISCRIMINATOR
# -------------
# A PR is treated as release-cycle if EITHER:
#   - the title matches `^chore\(release\):` (PR-F canonical subject), OR
#   - the source branch matches `release/v\d.*` (release branch; the
#     `\d` after `v` rejects placeholder names like `release/v` itself).
# If neither matches, the label is NOT applied and the release-gate is
# NOT dispatched; the dev can always apply the label manually.
#
# IDEMPOTENCE
# -----------
# The workflow checks the PR's current labels before calling the
# add-labels API. If `release-ready` is already on the PR, the addLabels
# call is skipped (no API write, no noise in the audit log). The
# release-gate dispatch fires when the discriminator matches AND the
# label is on the PR (either pre-applied or just applied) — a manual
# prior label-apply may not have triggered the gate, so we re-dispatch
# to be sure. If addLabels fails (label deleted upstream, transient
# error), dispatch is skipped to avoid running the gate on a PR that
# does not actually carry the label.
#
# LABEL-EVENT NOISE GUARD
# -----------------------
# `labeled` events fire for ANY label, not just `release-ready`. The
# job-level `if:` filters to only `release-ready` labeled events; other
# events (opened, edited, synchronize) run unconditionally so the
# discriminator + idempotence logic decides. Without this guard, adding
# an unrelated label (`needs-review`, etc.) to a release PR would
# re-dispatch release-gate redundantly.
#
# CROSS-WORKFLOW TRIGGER
# ----------------------
# GITHUB_TOKEN-issued API calls (including addLabels) do NOT trigger
# downstream workflows on label events; this is documented behavior
# (supply-chain protection against runaway recursion). To actually
# make release-gate.yml run, we call `actions.createWorkflowDispatch`
# directly. This requires `actions: write` permission below.

name: Auto-apply release-ready label

on:
  pull_request:
    types: [opened, edited, synchronize, labeled]

permissions:
  pull-requests: write
  actions: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'release-ready'
    steps:
      - name: Apply release-ready label and dispatch release-gate when discriminator matches
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const title = pr.title || '';
            const headRef = pr.head && pr.head.ref ? pr.head.ref : '';
            const titleMatches = /^chore\(release\):/.test(title);
            const branchMatches = /^release\/v\d/.test(headRef);
            if (!titleMatches && !branchMatches) {
              core.info(`Discriminator did not match (title='${title}', head='${headRef}', action='${action}'); skipping.`);
              return;
            }
            let labelApplied = false;
            const existing = (pr.labels || []).map(l => l.name);
            if (existing.includes('release-ready')) {
              core.info(`Label \`release-ready\` already on PR #${pr.number} (action='${action}'); re-dispatching release-gate (idempotent addLabels skipped).`);
              labelApplied = true;
            } else {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['release-ready'],
                });
                labelApplied = true;
                core.info(`Applied label \`release-ready\` to PR #${pr.number} (title='${title}', head='${headRef}', action='${action}').`);
              } catch (e) {
                core.warning(`Failed to apply 'release-ready' label: ${e.message}. Was it deleted? Recreate via: gh label create release-ready --color 0E8A16`);
              }
            }
            if (!labelApplied) {
              core.warning(`Skipping release-gate dispatch because 'release-ready' label is not on PR #${pr.number} (addLabels failed).`);
              return;
            }
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'release-gate.yml',
                ref: headRef,
              });
              core.info(`Dispatched release-gate.yml workflow for PR head ref '${headRef}' (PR #${pr.number}, action='${action}').`);
            } catch (e) {
              core.warning(`Failed to dispatch release-gate: ${e.message}. Manual run via 'gh workflow run release-gate.yml --ref ${headRef}' will work.`);
            }
