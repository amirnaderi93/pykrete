# Release gate
#
# v1.10 PR-A2 — closes v1.9 arch-I2.
# v1.13 PR-A2 — drop `pull_request` trigger so the dispatched run is the
# only publisher of the `release-gate-check` check-run name. Closes v1.12
# retro polling-step manual workaround AND the silent-bypass that the
# split-by-event design (initial PR-A2 R1) left open. See
# `docs/design/v1.13-spec.md` §3 + §14.
#
# WHY THIS EXISTS
# ---------------
# The daily CI workflow (.github/workflows/ci.yml) runs
# `scripts/changelog-grep.sh --skip-live-extract` because pykrete-tests
# isn't checked out beside pykrete on the runner. That defers the
# live-extract numeric trust-claim verification (text-numeric blocks +
# prose paragraph numeric claims, gate v2 + v3) to a manual step at
# PR-F time. A dev who forgets to run it locally can ship a CHANGELOG
# with stale "N probes" / "N fixtures" / "N positive" claims.
#
# This workflow closes the gap structurally: on push to a release branch
# (release/v*) OR on manual dispatch (the real gate, normally fired by
# auto-label-release-pr.yml's `createWorkflowDispatch` API call), it
# checks out both pykrete + pykrete-tests as siblings and runs the gate
# WITHOUT --skip-live-extract.
#
# TRIGGER MODEL
# -------------
# - push to release/v* — pre-tag verification (cycle-close PR-F should
#   have already run this locally; this is the structural guard). Runs
#   the FULL gate under check-name `release-gate-check`.
# - workflow_dispatch — the real gate on PRs. v1.12 PR-A1's auto-label
#   workflow fires `actions.createWorkflowDispatch` against this workflow
#   when a PR is labeled `release-ready`, OR an operator dispatches
#   manually. Runs the FULL gate under check-name `release-gate-check`.
#   Branch protection requires this name.
#
# WHY NO `pull_request` TRIGGER (v1.13 PR-A2)
# -------------------------------------------
# Branch-protection matches checks BY NAME. Per GitHub docs, *"a job
# that is skipped will report its status as 'Success'. It will not
# prevent a pull request from merging, even if it is a required
# check."* If this workflow listened to `pull_request` events, the
# pull_request-triggered check (whether skipped via `if:` or run as a
# no-op) would publish a `release-gate-check` check-run that
# branch-protection would treat as Success — silently bypassing the
# required-check on every ordinary PR.
#
# The fix: drop `pull_request` entirely. On ordinary PRs the
# `release-gate-check` check-run NEVER publishes; branch-protection
# sits in "Expected — Waiting for status to be reported" state.
# `release-ready`-labeled PRs trigger the auto-label workflow's
# `createWorkflowDispatch` call, which publishes a `release-gate-check`
# check-run via the workflow_dispatch event; once that reports SUCCESS
# branch-protection unblocks.
#
# WHY NOT "ALWAYS RUN LIVE-EXTRACT ON EVERY PR"
# --------------------------------------------
# The live extract requires checking out pykrete-tests + running
# `probes.py extract cross-codebase` (tens of seconds + transitive
# Python deps). On every PR it would inflate daily CI load 5-10x for a
# class of bug that only ships at release time. Release-gate is the
# cost-correct trigger.

name: Release gate

on:
  push:
    branches:
      - 'release/v*'
  workflow_dispatch:

# v1.12 PR-A2 — concurrency cap. A `release-ready`-labeled PR receiving
# multiple dispatched runs (push, label re-apply, re-open) used to queue
# concurrent runs against the same ref, each independently re-compiling
# release-mode tests. Cancel in-flight on superseded refs.
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate-check:
    # Real gate: push to release/v* OR workflow_dispatch (auto-label
    # API or manual). Branch protection REQUIRES this job's name.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pykrete
        uses: actions/checkout@v4
        with:
          path: pykrete

      # The known-claim table in scripts/changelog-grep.sh references
      # `../pykrete-tests/` relative to the pykrete checkout root. Check
      # out pykrete-tests as a sibling directory so the live extracts
      # resolve.
      - name: Checkout pykrete-tests sibling
        uses: actions/checkout@v4
        with:
          repository: amirnaderi93/pykrete-tests
          path: pykrete-tests

      - name: Install Python (for probes.py)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # Cache scope is isolated from `ci.yml`'s cache by `workspaces: pykrete`
      # (the path subdirectory differs — daily CI checks out at repo root, this
      # workflow checks out under `pykrete/`). First release-gate run on a
      # given commit is therefore cold; subsequent runs hit the cache.
      # Acceptable since release-gate runs only on release branches +
      # `release-ready`-labeled PRs + manual dispatch, not every push.
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pykrete

      # Self-tests verify the gate itself is healthy before we trust its
      # judgment on CHANGELOG. Order: self-tests first, then the live gate.
      - name: CHANGELOG grep gate — self-tests
        working-directory: pykrete
        run: bash scripts/changelog-grep.test.sh

      - name: CHANGELOG cite-check — self-tests
        working-directory: pykrete
        run: bash scripts/changelog-cite-check.test.sh

      # v1.12 PR-A2 — runner-perf fix. The full live-extract step's `tests`
      # numeric-claim used to invoke `cargo test --release --workspace`,
      # then the workflow's final step re-ran the same command. On a cold
      # runner that doubled the ~5-10 min release build (observed ~34 min
      # total on run 27698126977). The fix: run the release-mode test suite
      # ONCE here, tee the output, extract the summed `<N> passed` count to
      # a file, and pass that path to changelog-grep via
      # PYKRETE_TESTS_COUNT_FILE so its `tests` claim reads the file
      # instead of re-invoking cargo. The previous duplicate final step is
      # removed.
      - name: Cargo test (release mode) + write test-count for memoization
        working-directory: pykrete
        run: |
          set -o pipefail
          mkdir -p target
          cargo test --release --workspace 2>&1 | tee target/release-test-output.log
          grep -oE '[0-9]+ passed' target/release-test-output.log \
            | awk '{s+=$1} END {print s}' \
            > target/release-test-count.txt
          echo "release-gate: cached release-test count: $(cat target/release-test-count.txt)"

      # The release gate. WITHOUT --skip-live-extract: every text-numeric
      # block AND every prose paragraph numeric claim is verified against
      # the live extract commands. Drift fails the build.
      #
      # PYKRETE_TESTS_COUNT_FILE points at the file written by the prior
      # step — changelog-grep reads it instead of re-running cargo, saving
      # the duplicated release-mode compile.
      # PYKRETE_GREP_TIMING=1 emits per-claim wall-clock timing on stderr
      # so a future stall can be localized to a specific key without
      # adding ad-hoc `set -x`.
      - name: CHANGELOG grep gate — full live extract (v2 + v3)
        working-directory: pykrete
        env:
          PYKRETE_TESTS_COUNT_FILE: ${{ github.workspace }}/pykrete/target/release-test-count.txt
          PYKRETE_GREP_TIMING: '1'
        run: |
          # Fail loud if the memoized count file is missing — without this
          # guard, changelog-grep.sh would silently fall back to re-running
          # `cargo test --release --workspace`, blowing past the 600s budget
          # ~34 min later with no signal that memoization broke.
          if [ ! -f "$PYKRETE_TESTS_COUNT_FILE" ]; then
            echo "release-gate: PYKRETE_TESTS_COUNT_FILE not found at $PYKRETE_TESTS_COUNT_FILE — memoization broken" >&2
            exit 1
          fi
          start=$(date +%s)
          bash scripts/changelog-grep.sh
          end=$(date +%s)
          elapsed=$((end - start))
          echo "release-gate: changelog-grep.sh wall-clock: ${elapsed}s"
          # Budget guard: with memoization in place the gate should run in
          # well under 5 minutes. A hard 600s (10min) ceiling catches a
          # regression of this fix's invariants without flaking on shared-
          # runner variance.
          if [ "$elapsed" -gt 600 ]; then
            echo "release-gate: changelog-grep.sh exceeded 600s budget (was ${elapsed}s) — investigate per-claim timings above" >&2
            exit 1
          fi

      # v1.11 PR-A2 — file:line cites in CHANGELOG must resolve to live
      # source. Catches the v1.10 cite-drift class mechanically.
      - name: CHANGELOG cite-check
        working-directory: pykrete
        run: bash scripts/changelog-cite-check.sh

      # Trust-claim sweep checklist (v1.11 PR-A1). Sibling to
      # changelog-grep: where changelog-grep verifies CHANGELOG vs live
      # source (docs-vs-source), the sweep checklist verifies the docs
      # surfaces don't still carry the prior release's numbers
      # (docs-vs-history). Closes the 5-cycle PR-F-miscount pattern
      # (v1.6 / v1.7 / v1.8 / v1.9 / v1.10).
      - name: Trust-claim sweep checklist — self-tests
        working-directory: pykrete
        run: bash scripts/trust-claim-sweep-checklist.test.sh

      - name: Trust-claim sweep checklist — full surface scan
        working-directory: pykrete
        run: bash scripts/trust-claim-sweep-checklist.sh
