name: docs

# Builds docs-site/ (Astro + Starlight) and deploys to GitHub Pages on
# every push to main. Path-filtered so unrelated changes don't burn CI
# minutes; manual dispatch is wired for one-off rebuilds.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      # The playground page imports the pykrete-wasm package, which is
      # rebuilt from these sources by docs-site's `prebuild` script.
      # Trigger a docs rebuild when the wasm crate (or the analyzer it
      # wraps) changes so the deployed playground tracks main.
      - 'crates/pykrete-wasm/**'
      - 'crates/pykrete/**'
      - 'scripts/build-wasm.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow at most one in-flight deploy. Don't cancel an in-flight build —
# Pages doesn't gain from concurrent runs and a cancelled deploy can
# leave the site in an unpredictable state.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No lockfile (committed .gitignore excludes them so users
          # can pick npm/pnpm/yarn locally). CI uses npm install on a
          # fresh tree each run.

      # The /playground page imports the local `pykrete-wasm` package,
      # which docs-site's `prebuild` script regenerates by invoking
      # `scripts/build-wasm.sh`. That script needs the wasm Rust target
      # and the `wasm-pack` binary on PATH — install both before the
      # site build runs.
      - name: Install Rust (with wasm target)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          # Share the cache with the dedicated WASM workflow so the
          # docs build doesn't pay a cold compile cost.
          workspaces: '. -> target'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/configure-pages@v5

      # Build the wasm package BEFORE `npm install` — the docs-site's
      # package.json references it as a local `file:` dependency, and
      # the output directory is gitignored, so a fresh checkout has
      # nothing for npm to install from until we build it.
      #
      # Working directory is docs-site/ (job default), so step up to
      # the repo root to invoke the build script.
      - name: Build pykrete-wasm package
        working-directory: .
        run: ./scripts/build-wasm.sh

      - name: Install dependencies
        run: npm install
      - name: Build site
        # The `prebuild` hook re-runs the wasm build here too — cheap
        # because cargo + wasm-pack are both cached at this point,
        # and it keeps the local-vs-CI parity honest.
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
