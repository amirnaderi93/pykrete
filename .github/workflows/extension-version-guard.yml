# Extension version guard
#
# WHY THIS EXISTS
# ---------------
# The v0.1.10 release silently failed to republish the VS Code extension.
# `editors/vscode/package.json`'s `"version"` was not bumped along with the
# Rust workspace version, so `vsce publish` / `ovsx publish` saw 0.2.7 was
# already on the marketplaces and logged "0.2.7 already published, skipping".
# The GitHub release attached the freshly-built .vsix, but the marketplaces
# kept serving the older binary. End users who reinstalled got the stale
# extension and never saw the new hover format.
#
# This workflow blocks the same failure from recurring. On every PR, it
# inspects the diff SINCE THE LAST RELEASE TAG: if anything that ships
# inside the .vsix (extension TS source, the bundled pykrete-lsp binary
# which is the Cargo workspace version, or extension deps) changed in
# that range, then `editors/vscode/package.json`'s top-level `"version"`
# line must also have changed in that range. Otherwise the PR fails.
#
# WHY "SINCE LAST TAG", NOT "PR DIFF"
# -----------------------------------
# A single package.json bump per release cycle is sufficient — typically
# it lands in the release PR alongside the Cargo.toml bump. Comparing
# only the PR's own diff caused the guard to fire on every feature PR
# that touched extension-impacting code, even though the upcoming
# release PR would bump the version once for the whole cycle. Comparing
# against the last release tag instead means: as soon as any merged
# commit since the tag bumped the version, subsequent feature PRs pass.
#
# EXAMPLES
# --------
# Fails (extension src touched in this PR, no version bump anywhere
# since the last release tag):
#   diff --git a/editors/vscode/src/extension.ts b/editors/vscode/src/extension.ts
#   -   client.start();
#   +   await client.start();
#   (no change to editors/vscode/package.json in the range)
#
# Passes (extension src touched, version was bumped earlier in the
# cycle — either in this PR or a previously merged one since the tag):
#   diff --git a/editors/vscode/src/extension.ts b/editors/vscode/src/extension.ts
#   -   client.start();
#   +   await client.start();
#   diff --git a/editors/vscode/package.json b/editors/vscode/package.json
#   -   "version": "0.2.7",
#   +   "version": "0.2.8",
#
# Passes (no extension-impacting changes since the last tag — docs-only
# work, CI tweaks, etc.):
#   diff --git a/README.md b/README.md
#   ...
#
# NOTE
# ----
# After this workflow is merged, add it to the branch protection rule's
# "required status checks" list so it actually blocks merges.

name: Extension version guard

on:
  pull_request:

jobs:
  check:
    name: extension version bumped when extension code changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check extension version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          # Determine the diff range. Prefer "<latest release tag>..HEAD"
          # so the guard reflects whether the *cycle* (since the last
          # published release) bumped the extension version — not just
          # this PR in isolation. Falls back to the PR's own diff when
          # there are no release tags yet (fresh repo).
          git fetch --tags --force origin >/dev/null 2>&1 || true

          if latest_tag=$(git describe --tags --abbrev=0 --match='v[0-9]*' 2>/dev/null); then
            diff_spec="$latest_tag..$HEAD_SHA"
            echo "Latest release tag: $latest_tag"
            echo "Diff range: $diff_spec (since last release tag)"
          else
            diff_spec="$BASE_SHA...$HEAD_SHA"
            echo "No release tags found — falling back to PR diff range: $diff_spec"
          fi

          changed_files=$(git diff --name-only "$diff_spec")
          echo "Changed files:"
          echo "$changed_files"

          # Does any changed file impact what ships inside the .vsix?
          #
          # - editors/vscode/**               — anything shipped in the .vsix
          #                                     (src/, syntaxes/, README.md,
          #                                     CHANGELOG.md, icon.png,
          #                                     language-configuration.json,
          #                                     package-lock.json, …),
          #                                     minus files excluded by
          #                                     .vscodeignore or not tracked
          # - crates/pykrete/**               — bundled pykrete-lsp behavior
          # - crates/pykrete-lsp/**           — bundled pykrete-lsp behavior
          # - Cargo.toml (workspace version)  — bumps the bundled binary
          # - editors/vscode/package.json     — only counts if a non-version
          #                                     line (e.g. dependencies)
          #                                     changed; the version line
          #                                     itself is handled separately
          extension_impacting=0

          # crates/pykrete{,-lsp}/** — note: tests/** under these also fires
          # the guard. That's a known false-positive (test-only PRs would
          # require an extension version bump). Fine for now — bumping a
          # patch on a test-only PR is cheap and the alternative is brittle
          # excludes. Revisit if it becomes annoying.
          if echo "$changed_files" | grep -qE '^crates/pykrete(-lsp)?/'; then
            extension_impacting=1
            echo "Extension-impacting change: crates/pykrete{,-lsp}/**"
          fi

          # Top-level Cargo.toml workspace version line.
          if echo "$changed_files" | grep -qxF 'Cargo.toml'; then
            if git diff "$diff_spec" -- Cargo.toml \
                | grep -qE '^[+-][[:space:]]*version[[:space:]]*='; then
              extension_impacting=1
              echo "Extension-impacting change: Cargo workspace version"
            fi
          fi

          # editors/vscode/package.json: count any change that is NOT the
          # top-level "version" line. Easiest is to look for added/removed
          # lines containing `"dependencies"` / `"devDependencies"` blocks
          # — but the safest signal is "any +/- line that isn't the
          # top-level version line".
          #
          # NOTE: the `"version":` anchor here is "+/- line whose first
          # non-whitespace token is the version key". If we ever introduce
          # a nested `"version"` key inside this package.json (e.g. under
          # a dependency entry), this regex would also match it and the
          # guard would mis-classify that change as a version bump. Not a
          # real risk today — top-level package.json only has one
          # `"version"` line. Future-proof option: parse with `jq` and
          # compare the top-level `.version` field across base and head.
          if echo "$changed_files" | grep -qxF 'editors/vscode/package.json'; then
            non_version_changes=$(
              git diff "$diff_spec" -- editors/vscode/package.json \
                | grep -E '^[+-]' \
                | grep -vE '^(\+\+\+|---)' \
                | grep -vE '^[+-][[:space:]]*"version"[[:space:]]*:' \
                || true
            )
            if [ -n "$non_version_changes" ]; then
              extension_impacting=1
              echo "Extension-impacting change: editors/vscode/package.json (non-version line)"
            fi
          fi

          # Broad editors/vscode/** matcher — catches everything else that
          # ends up inside the .vsix: TextMate grammar (syntaxes/), the
          # marketplace listing (README.md), the update-time notes
          # (CHANGELOG.md), language-configuration.json, icon.png, etc.
          #
          # Exclusions mirror .vscodeignore plus a few items that are
          # gitignored or are handled by the earlier package.json-specific
          # block:
          #   - out/                — gitignored (build artifact)
          #   - node_modules/       — gitignored
          #   - .vscode/            — .vscodeignore
          #   - .vscode-test/       — .vscodeignore
          #   - .gitignore          — .vscodeignore
          #   - tsconfig.json       — .vscodeignore (**/tsconfig.json)
          #   - *.map               — .vscodeignore (**/*.map)
          #   - .eslintrc.json      — .vscodeignore (**/.eslintrc.json)
          #   - package.json        — handled by the dedicated block above
          # Note: src/** is intentionally NOT excluded — it's listed in
          # .vscodeignore because TS gets compiled to out/ before packaging,
          # but a change to src/** still changes what ships.
          if echo "$changed_files" \
              | grep -E '^editors/vscode/' \
              | grep -vE '^editors/vscode/(out/|node_modules/|\.vscode/|\.vscode-test/|\.gitignore|package\.json$|.*tsconfig\.json$|.*\.map$|.*\.eslintrc\.json$)' \
              | grep -q .; then
            extension_impacting=1
            echo "Extension-impacting change: editors/vscode/** (shipped in .vsix)"
          fi

          if [ "$extension_impacting" -eq 0 ]; then
            echo "No extension-impacting changes detected — version bump not required."
            exit 0
          fi

          # Did the top-level "version" line in editors/vscode/package.json
          # change? Look for +/- lines matching `"version":` in that file's
          # diff. The field only appears once at the top level of the
          # package.json we care about, so a literal match is safe.
          version_line_diff=$(
            git diff "$diff_spec" -- editors/vscode/package.json \
              | grep -E '^[+-][[:space:]]*"version"[[:space:]]*:' \
              | grep -vE '^(\+\+\+|---)' \
              || true
          )

          if [ -n "$version_line_diff" ]; then
            echo "editors/vscode/package.json version line was bumped:"
            echo "$version_line_diff"
            exit 0
          fi

          echo "::error::This PR modifies code that ships inside the VS Code extension, but editors/vscode/package.json version was not bumped. The marketplace will silently skip republishing. Bump the patch number."
          exit 1
