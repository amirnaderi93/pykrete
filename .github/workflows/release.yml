name: Release

# Tagging `vX.Y.Z` builds release artifacts for every supported platform
# and publishes them on a GitHub Release: tarballs for macOS and Linux,
# an MSI installer for Windows. It then updates the Homebrew tap.
#
# It can also be run manually (workflow_dispatch) against an existing tag
# — useful to re-build a release after a workflow fix.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both macOS targets build on an Apple Silicon runner: arm64
        # natively, x86_64 by cross-compiling, which the universal macOS
        # toolchain handles with no extra setup. GitHub's Intel macOS
        # runners are retired.
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # macOS / Linux: a tarball of the two binaries.
      - name: Package (tarball)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          staging="pykrete-$tag-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/pykrete" "$staging"/
          cp "target/${{ matrix.target }}/release/pykrete-lsp" "$staging"/
          cp README.md LICENSE "$staging"/
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" | tee "$staging.tar.gz.sha256"

      # Windows: an MSI installer (cargo-wix / WiX). It drops both
      # binaries into Program Files and appends them to the system PATH.
      - name: Package (MSI installer)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          msi="pykrete-$tag-${{ matrix.target }}.msi"
          cargo install cargo-wix --locked
          # --package is required in a workspace; cargo-wix then reads the
          # WiX source from that package's wix/ directory. --nocapture
          # forwards candle/light's output so any WiX error is visible.
          cargo wix --package pykrete --no-build --nocapture --target ${{ matrix.target }} \
            --install-version "${tag#v}" --output "$msi"
          # Git Bash on Windows ships `sha256sum`, not `shasum`.
          sha256sum "$msi" | tee "$msi.sha256"

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            pykrete-*.tar.gz
            pykrete-*.tar.gz.sha256
            pykrete-*.msi
            pykrete-*.msi.sha256
          generate_release_notes: true

      # Hand off `pykrete-lsp` to the vsix job — it bundles the
      # platform-specific binary inside its matching .vsix.
      - name: Stage pykrete-lsp for the vsix job
        shell: bash
        run: |
          mkdir -p staged
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "target/${{ matrix.target }}/release/pykrete-lsp.exe" staged/
          else
            cp "target/${{ matrix.target }}/release/pykrete-lsp" staged/
          fi
      - name: Upload pykrete-lsp binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: pykrete-lsp-${{ matrix.target }}
          path: staged/
          retention-days: 1

  # Build the VS Code / Cursor / VSCodium extension as one .vsix per
  # platform — each with the matching `pykrete-lsp` binary bundled
  # inside so the user installs nothing else. Publishes per-target to
  # VS Marketplace and Open VSX; the marketplaces serve each user the
  # .vsix for their platform automatically.
  vsix:
    name: vsix · ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            rust_target: aarch64-apple-darwin
            binary: pykrete-lsp
          - target: darwin-x64
            rust_target: x86_64-apple-darwin
            binary: pykrete-lsp
          - target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            binary: pykrete-lsp
          - target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            binary: pykrete-lsp.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Download pykrete-lsp binary
        uses: actions/download-artifact@v4
        with:
          name: pykrete-lsp-${{ matrix.rust_target }}
          path: editors/vscode/server/
      - name: Mark the binary executable
        # POSIX targets only; on Windows the .exe extension is what
        # makes a file executable.
        if: matrix.target != 'win32-x64'
        run: chmod +x "editors/vscode/server/${{ matrix.binary }}"
      - name: Package the .vsix
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          vsix="pykrete-vscode-$tag-${{ matrix.target }}.vsix"
          ( cd editors/vscode && npm ci --no-audit --no-fund )
          ( cd editors/vscode && npx vsce package --target ${{ matrix.target }} --out "$GITHUB_WORKSPACE/$vsix" )
          sha256sum "$vsix" | tee "$vsix.sha256"
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            pykrete-vscode-*-${{ matrix.target }}.vsix
            pykrete-vscode-*-${{ matrix.target }}.vsix.sha256
          generate_release_notes: true

      # Open VSX is the registry Cursor, VSCodium, code-server and Theia
      # use by default. Publishing here gives "search → install" UX in
      # those editors. The step is a no-op when OVSX_TOKEN isn't set.
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "${OVSX_TOKEN:-}" ]; then
            echo "::notice::OVSX_TOKEN not set; skipping Open VSX publish"
            exit 0
          fi
          tag="${{ inputs.tag || github.ref_name }}"
          vsix="pykrete-vscode-$tag-${{ matrix.target }}.vsix"
          set +e
          out=$(npx --yes ovsx publish "$vsix" -p "$OVSX_TOKEN" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" = 0 ]; then
            echo "::notice::Open VSX: published $vsix"
          elif echo "$out" | grep -qi 'already exists\|already published'; then
            echo "::notice::Open VSX: $tag/${{ matrix.target }} already on the registry, skipping"
          else
            echo "::warning::Open VSX publish failed (rc=$rc) — see log above; the GitHub Release upload already succeeded"
          fi

      # Visual Studio Marketplace (Microsoft) — vanilla VS Code's
      # default search/install source. The step is a no-op when
      # VSCE_PAT isn't set. The .vsix already carries the target in
      # its manifest, so `vsce publish` picks it up automatically.
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT not set; skipping VS Marketplace publish"
            exit 0
          fi
          tag="${{ inputs.tag || github.ref_name }}"
          vsix="$GITHUB_WORKSPACE/pykrete-vscode-$tag-${{ matrix.target }}.vsix"
          cd editors/vscode
          set +e
          out=$(npx vsce publish -p "$VSCE_PAT" --packagePath "$vsix" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" = 0 ]; then
            echo "::notice::VS Marketplace: published ${{ matrix.target }}"
          elif echo "$out" | grep -qi 'already exists\|already published\|same version\|version.*already'; then
            echo "::notice::VS Marketplace: $tag/${{ matrix.target }} already published, skipping"
          else
            echo "::warning::VS Marketplace publish failed (rc=$rc) — see log above; the GitHub Release upload already succeeded"
          fi

  # Platform-neutral .vsix — no bundled binary, no --target. The marketplaces
  # prefer the per-target .vsix above when one matches the user's platform,
  # and fall back to this universal one otherwise. Without it, anyone outside
  # the matrix (linux-arm64, win32-arm64, musl, …) sees "no compatible
  # extension" and can't install at all, even though the extension's PATH
  # fallback would happily find a manually-installed pykrete-lsp.
  vsix_universal:
    name: vsix · universal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Package the .vsix
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          vsix="pykrete-vscode-$tag-universal.vsix"
          ( cd editors/vscode && npm ci --no-audit --no-fund )
          ( cd editors/vscode && npx vsce package --out "$GITHUB_WORKSPACE/$vsix" )
          sha256sum "$vsix" | tee "$vsix.sha256"
      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            pykrete-vscode-*-universal.vsix
            pykrete-vscode-*-universal.vsix.sha256
          generate_release_notes: true

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "${OVSX_TOKEN:-}" ]; then
            echo "::notice::OVSX_TOKEN not set; skipping Open VSX publish"
            exit 0
          fi
          tag="${{ inputs.tag || github.ref_name }}"
          vsix="pykrete-vscode-$tag-universal.vsix"
          set +e
          out=$(npx --yes ovsx publish "$vsix" -p "$OVSX_TOKEN" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" = 0 ]; then
            echo "::notice::Open VSX: published $vsix"
          elif echo "$out" | grep -qi 'already exists\|already published'; then
            echo "::notice::Open VSX: $tag/universal already on the registry, skipping"
          else
            echo "::warning::Open VSX publish failed (rc=$rc) — see log above; the GitHub Release upload already succeeded"
          fi

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT not set; skipping VS Marketplace publish"
            exit 0
          fi
          tag="${{ inputs.tag || github.ref_name }}"
          vsix="$GITHUB_WORKSPACE/pykrete-vscode-$tag-universal.vsix"
          cd editors/vscode
          set +e
          out=$(npx vsce publish -p "$VSCE_PAT" --packagePath "$vsix" 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" = 0 ]; then
            echo "::notice::VS Marketplace: published universal"
          elif echo "$out" | grep -qi 'already exists\|already published\|same version\|version.*already'; then
            echo "::notice::VS Marketplace: $tag/universal already published, skipping"
          else
            echo "::warning::VS Marketplace publish failed (rc=$rc) — see log above; the GitHub Release upload already succeeded"
          fi

  # Re-render the Homebrew formula from the freshly published checksums
  # and push it to the tap. Requires a HOMEBREW_TAP_TOKEN secret — a
  # token with contents:write on the amirnaderi93/homebrew-pykrete repo.
  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pykrete (for the formula renderer)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check out the Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: amirnaderi93/homebrew-pykrete
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render and push the formula
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"
          sha() { curl -fsSL "$base/pykrete-$TAG-$1.tar.gz.sha256" | cut -d' ' -f1; }
          export VERSION="${TAG#v}"
          export SHA_DARWIN_ARM="$(sha aarch64-apple-darwin)"
          export SHA_DARWIN_X64="$(sha x86_64-apple-darwin)"
          export SHA_LINUX_X64="$(sha x86_64-unknown-linux-gnu)"
          bash packaging/homebrew/render.sh > tap/Formula/pykrete.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pykrete.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "pykrete $TAG"
            git push
          fi
