[package]
name = "pykrete-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LSP server for pykrete — speaks Language Server Protocol over stdio."

[[bin]]
name = "pykrete-lsp"
path = "src/main.rs"

# Test-only "silent child" LSP: answers the `initialize` handshake, then
# stays mute on every subsequent request. The hover-timeout integration
# test points pykrete-lsp at this binary to reproduce basedpyright's
# never-answers-hover behavior. Built like a normal bin so the
# integration test locates it via `CARGO_BIN_EXE_silent-child-lsp`.
[[bin]]
name = "silent-child-lsp"
path = "src/bin/silent_child_lsp.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Reuse the analyzer library.
pykrete = { path = "../pykrete" }

# rust-analyzer's lightweight LSP framework — sync, no tokio. Pairs with
# `lsp-types` for the standardized request/notification structs.
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"

# Used to `select!` over the editor channel and the embedded child
# LSP's channel in the multiplexer. Same crate `lsp-server` uses
# internally for its own connection channels.
crossbeam-channel = "0.5"
