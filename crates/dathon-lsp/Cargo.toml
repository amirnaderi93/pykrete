[package]
name = "dathon-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LSP server for dathon — speaks Language Server Protocol over stdio."

[[bin]]
name = "dathon-lsp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Reuse the analyzer library.
dathon = { path = "../dathon" }

# rust-analyzer's lightweight LSP framework — sync, no tokio. Pairs with
# `lsp-types` for the standardized request/notification structs.
lsp-server = "0.7"
lsp-types = "0.95"
serde_json = "1"

# Used to `select!` over the editor channel and the embedded child
# LSP's channel in the multiplexer. Same crate `lsp-server` uses
# internally for its own connection channels.
crossbeam-channel = "0.5"
