[package]
name = "pykrete"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static schema checker for PySpark — a strict superset of Python."

[[bin]]
name = "pykrete"
path = "src/main.rs"

[dependencies]
# Astral does not publish ruff's internal crates to crates.io.
# The canonical way to depend on them is a pinned git reference.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.12" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.12" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.15.12" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.12" }

# Parses the SQL strings embedded in `F.expr(...)`, `selectExpr(...)`,
# and string-form `filter(...)` so their column references can be
# checked against the dataframe schema. `visitor` enables AST traversal.
sqlparser = { version = "0.62", features = ["visitor"] }

# `pykrete.json` project-config parsing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
